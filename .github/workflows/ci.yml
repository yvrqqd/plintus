name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dev deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest ruff mypy
      - name: Build and install native extension
        run: maturin develop --release
      - name: Python tests
        run: python -m pytest -q
      - name: Lint (ruff)
        run: ruff check src tests examples
      - name: Type check (mypy)
        run: mypy src || true  # non-blocking until annotations are complete

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests (pure-Rust, no python feature)
        working-directory: crates/core
        run: cargo test --no-default-features
      - name: Rust clippy
        working-directory: crates/core
        # dead_code is expected in the --no-default-features build: the pure-Rust
        # modules' real consumer is the `python` feature (off here) plus tests.
        run: cargo clippy --no-default-features -- -A dead_code -D warnings
