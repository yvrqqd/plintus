[package]
name = "plintus_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast CST core for plintus"

[lib]
name = "plintus_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Build the PyO3 extension module (enabled by maturin via pyproject.toml).
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.25", optional = true }
tree-sitter = "0.24"
tree-sitter-python = "0.23"
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
once_cell = "1.19"
memchr = "2.7"
