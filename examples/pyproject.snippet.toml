# Snippets for [tool.plintus]
#
# Copy the profile you need into your service pyproject.toml.

# --- default (all registered rules, including WPS) ---
[tool.plintus]
select = ["ALL"]
dict-quotes = "single"
message-quotes = "double"
banned-calls = ["eval", "exec"]
known-first-party = ["app"]
# cbp-import-prefix = "cbp_"
# line-length = 88  # I001 wrap; match [tool.ruff] line-length when both run

# When Ruff T20 is on, drop the duplicate CBP print rule:
# ignore = ["L002"]

# When Ruff isort (I) is also on, ignore one side so autofixes do not fight:
# (prefer plintus I001 for CBP four-section order)

# Opt out of WPS (MVP + CBP only):
# ignore = ["WPS"]
# ignore = ["WPS", "L002"]

# Tighten/relax WPS thresholds (wemake defaults shown):
# max-arguments = 5
# max-returns = 5
# max-cognitive-score = 12
# min-name-length = 2
# max-name-length = 45

# --- local-rules demo (examples/local_rules.py) ---
# [tool.plintus]
# local-rules = ["examples/local_rules.py"]
# select = ["X001"]
# workers = 1
# cache = false
